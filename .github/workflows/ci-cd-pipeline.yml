name: CI/CD - task-api

on:
  push:
    branches: [main]
    paths:
      - "ci-cd-pipeline/**"
      - ".github/workflows/ci-cd-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "ci-cd-pipeline/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/jahver/task-api

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ci-cd-pipeline/app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ci-cd-pipeline/app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (loaded locally for scanning, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ci-cd-pipeline/app
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: false
          load: true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Log in to GitHub Container Registry
        if: success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push (only runs if the scan above passed)
        if: success()
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest
